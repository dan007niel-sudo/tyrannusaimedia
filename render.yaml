# Render Blueprint — Tyrannus AI Media
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tyrannusaimedia
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn server:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: HISTORY_ADMIN_TOKEN
        sync: false  # Must be set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false  # Required for project persistence and storage uploads
      - key: SUPABASE_KEY
        sync: false  # Server-side Supabase key; never expose in frontend
      - key: PYTHON_VERSION
        value: 3.11.11
      # Bewegtbild (Stufe „Ambient") — auf dem Free-Plan AUS.
      #
      # Gemessen am 01.08.2026: schon der kleinstmögliche Auftrag (480p, 3 s,
      # ein Format) lässt die Instanz nach ~25 s mit 502 aussteigen und neu
      # starten. Auf 0,1 CPU hungert ffmpeg den einzigen Worker aus. Erst
      # wieder auf 1 setzen, wenn das Rendern woanders läuft.
      - key: MOTION_ENABLED
        value: "0"
      - key: MOTION_SHORT_EDGE
        sync: false  # nur relevant, wenn MOTION_ENABLED wieder 1 ist
      - key: FFMPEG_SHA256
        sync: false  # prüft den heruntergeladenen ffmpeg-Tarball, wenn gesetzt
